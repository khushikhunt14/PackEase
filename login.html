<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Portal - PackEase</title>
  <meta name="description" content="Access customer order history or log in to the PackEase Admin Panel.">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .login-container {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-subtle) 100%);
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 40px;
      box-shadow: var(--shadow-lg);
    }
    .role-tabs {
      display: flex;
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 24px;
    }
    .role-tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 6px;
      color: var(--text-muted);
      transition: var(--transition);
    }
    .role-tab.active {
      background: var(--bg-surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .demo-hint {
      background: var(--primary-subtle);
      border: 1px dashed var(--primary);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.8rem;
      color: var(--primary-dark);
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="logo">
      <span>📦</span> PackEase <span class="badge">Eco-Pack</span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="sustainability.html">Sustainability</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="nav-actions">
      <button id="themeBtn" aria-label="Toggle Theme">🌙</button>
      <a href="contact.html" class="btn btn-primary btn-sm">Get a Quote</a>
    </div>
  </header>

  <!-- Login Main Content -->
  <div class="login-container">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <span style="font-size: 2.5rem; display: block; margin-bottom: 8px;">📦</span>
        <h2 style="font-size: 1.8rem; color: var(--primary);">PackEase Portal Access</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Sign in to manage quote requests or access the admin panel.</p>
      </div>

      <!-- Role Switcher Tabs -->
      <div class="role-tabs">
        <button class="role-tab active" id="tabCustomer" onclick="switchRole('customer')">Customer Portal</button>
        <button class="role-tab" id="tabAdmin" onclick="switchRole('admin')">Admin Panel</button>
      </div>

      <!-- Demo Account Hint -->
      <!-- <div class="demo-hint" id="demoHint">
        <strong>Demo Admin Credentials:</strong><br>
        Username: <code style="background: rgba(255,255,255,0.7); padding: 2px 6px; border-radius: 4px;">admin</code> | Password: <code style="background: rgba(255,255,255,0.7); padding: 2px 6px; border-radius: 4px;">1234</code>
      </div> -->

      <!-- Auth Form -->
      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 16px;">
          <label for="loginUser">Username or Email</label>
          <input type="text" id="loginUser"  required>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label for="loginPass">Password</label>
          <input type="password" id="loginPass"  required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1rem; padding: 14px;">Sign In to Account</button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--text-muted);">
        <span>Or direct access: </span>
        <a href="admin-dashboard.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Launch Admin Dashboard directly →</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-bottom" style="border-top: none; padding-top: 0;">
      <p>© 2026 PackEase Solutions Inc. All rights reserved.</p>
    </div>
  </footer>

  <script src="main.js"></script>
  <script>
    let currentMode = 'customer';

    function switchRole(mode) {
      currentMode = mode;
      document.getElementById('tabCustomer').classList.toggle('active', mode === 'customer');
      document.getElementById('tabAdmin').classList.toggle('active', mode === 'admin');
      
      const userField = document.getElementById('loginUser');
      const passField = document.getElementById('loginPass');

      if (mode === 'admin') {
        userField.value = 'admin';
        passField.value = '1234';
      } else {
        userField.value = 'client@example.com';
        passField.value = 'password123';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('loginUser').value;
      const p = document.getElementById('loginPass').value;

      if (currentMode === 'admin' || u === 'admin') {
        if (p === '1234' || u === 'admin') {
          showToast('Admin Authentication Successful! Redirecting to dashboard...');
          setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
          }, 1000);
        } else {
          alert('Invalid password! For demo admin, use password: 1234');
        }
      } else {
        showToast('Customer Login Successful! Welcome back.');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      }
    });
  </script>
</body>
</html>
